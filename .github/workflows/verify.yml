name: Verify

on:
  pull_request:

permissions:
  contents: read

# A new push to the PR supersedes the previous run.
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify
