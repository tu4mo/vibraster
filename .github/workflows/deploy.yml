name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Let an in-progress deployment finish; queue the next one instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's base path
    steps:
      - uses: actions/checkout@v7

      # Sets up Vite+ and runs `vp check`; `vp` stays on PATH for the build below.
      - uses: ./.github/actions/verify

      - id: pages
        uses: actions/configure-pages@v6

      # Project pages are served from /<repo>/, so assets need that base path.
      - run: vp build --base "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
